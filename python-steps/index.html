<title>Python Steps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Learn Python by building an AI assistant: a daily story-driven practice app for your phone.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
<style>
/* Layout: one phone-first column (max 560px). Home shows progress as Python variables on a code
   card above a vertical path of days; each lesson step centres on a ruled, numbered code editor
   with a symbol row and a sticky action bar. Palette borrows Python's own blue and yellow. */
:root {
  --paper: #F2F5F9;
  --card: #FFFFFF;
  --ink: #13233A;
  --muted: #56677D;
  --line: #D9E1EB;
  --rule: #EDF1F6;
  --blue: #2A62A3;
  --blue-ink: #FFFFFF;
  --blue-soft: #E3EDF8;
  --yellow: #FFD43B;
  --yellow-ink: #3A2E00;
  --flame: #D98C00;
  --ok: #1D7445;
  --ok-soft: #E1F2E8;
  --bad: #B3261E;
  --bad-soft: #FCE9E7;
  --note-soft: #FFF5D1;
  --code-bg: #FBFCFE;
  --syn-str: #9E4F1B;
  --syn-num: #2A62A3;
  --syn-kw: #7A3DA5;
  --syn-fn: #0D6B7A;
  --syn-com: #66788E;
  --shadow: 0 1px 2px rgba(19, 35, 58, .06), 0 6px 20px rgba(19, 35, 58, .06);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --f-story: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1420; --card: #151F2E; --ink: #E6EDF6; --muted: #9AAABF; --line: #283750; --rule: #182439;
    --blue: #7DB0EA; --blue-ink: #0B1A2C; --blue-soft: #1B2C44; --yellow: #FFD43B; --yellow-ink: #2B2200; --flame: #FFC233;
    --ok: #5DD39E; --ok-soft: #12301F; --bad: #FF8A7A; --bad-soft: #3A1714; --note-soft: #332A0E; --code-bg: #101926;
    --syn-str: #F2B880; --syn-num: #7DB0EA; --syn-kw: #C8A2F2; --syn-fn: #6FD3E3; --syn-com: #8798AE;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1420; --card: #151F2E; --ink: #E6EDF6; --muted: #9AAABF; --line: #283750; --rule: #182439;
  --blue: #7DB0EA; --blue-ink: #0B1A2C; --blue-soft: #1B2C44; --yellow: #FFD43B; --yellow-ink: #2B2200; --flame: #FFC233;
  --ok: #5DD39E; --ok-soft: #12301F; --bad: #FF8A7A; --bad-soft: #3A1714; --note-soft: #332A0E; --code-bg: #101926;
  --syn-str: #F2B880; --syn-num: #7DB0EA; --syn-kw: #C8A2F2; --syn-fn: #6FD3E3; --syn-com: #8798AE;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-height: 100%;
}
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 30px; font-weight: 800; line-height: 1.1; }
h2 { font-size: 23px; font-weight: 800; line-height: 1.2; }
h3 { font-size: 18px; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
.ico { display: inline-flex; width: 20px; height: 20px; flex: none; }
.ico svg { width: 100%; height: 100%; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ic { font-family: var(--f-mono); font-size: .88em; background: var(--blue-soft); color: var(--ink); padding: 1px 6px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
.muted { color: var(--muted); }

/* ---------- buttons */
.btn {
  min-height: 50px; padding: 0 18px; border-radius: 14px; border: 1px solid transparent;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 700; font-size: 17px; cursor: pointer; text-decoration: none;
  transition: transform .08s ease, background-color .15s ease;
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--blue); color: var(--blue-ink); }
.btn-ghost { background: var(--card); border-color: var(--line); color: var(--ink); }
.btn-ok { background: var(--ok); color: var(--card); }
.btn-small { min-height: 40px; padding: 0 12px; font-size: 15px; border-radius: 11px; }
.btn-link { background: none; border: 0; padding: 6px 2px; color: var(--blue); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1 1 0; min-width: 0; }

/* ---------- home */
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
  background: var(--blue); color: var(--blue-ink); font-family: var(--f-mono); font-weight: 600; font-size: 15px;
  box-shadow: inset 0 -5px 0 var(--yellow);
}
.brand h1 { font-size: 26px; }
.home-sub { color: var(--muted); margin-top: 4px; }
.progress-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 16px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px;
}
.vars { margin: 0; font-family: var(--f-mono); font-size: 15px; line-height: 1.75; white-space: pre; overflow-x: auto; }
.vars .n { color: var(--ink); font-weight: 600; }
.vars .o { color: var(--muted); }
.vars .v { color: var(--syn-num); font-weight: 600; }
.vars .c { color: var(--syn-com); }
.level { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
.bar { height: 10px; border-radius: 999px; background: var(--rule); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--yellow); border-radius: inherit; transition: width .4s ease; }
.today {
  background: var(--blue); color: var(--blue-ink); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px;
}
.today .eyebrow { color: inherit; opacity: .85; }
.today h2 { font-size: 24px; }
.today p { opacity: .92; }
.today .btn { background: var(--yellow); color: var(--yellow-ink); align-self: flex-start; }
.today .note { font-size: 15px; background: rgba(255, 255, 255, .14); padding: 8px 10px; border-radius: 10px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.path { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.day { position: relative; }
.day:not(:last-child)::before {
  content: ""; position: absolute; left: 21px; top: 46px; bottom: -2px; width: 2px; background: var(--line);
}
.day.done:not(:last-child)::before { background: var(--blue); }
.day-btn {
  width: 100%; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: start;
  background: none; border: 0; padding: 0 0 16px; text-align: left; cursor: pointer;
}
.day-btn[disabled] { cursor: default; }
.dot {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  border: 2px solid var(--line); background: var(--card); font-weight: 700; color: var(--muted);
  font-variant-numeric: tabular-nums; position: relative; z-index: 1;
}
.day.done .dot { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
.day.current .dot { border-color: var(--blue); color: var(--blue); box-shadow: 0 0 0 5px var(--blue-soft); }
.day-text { min-width: 0; padding-top: 2px; }
.day-text strong { display: block; font-size: 17px; }
.day-text span { display: block; color: var(--muted); font-size: 15px; }
.day.locked .day-text { opacity: .6; }
.tag { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; margin-top: 10px; white-space: nowrap; }
.tag-done { background: var(--ok-soft); color: var(--ok); }
.tag-today { background: var(--yellow); color: var(--yellow-ink); }
.tag-locked { background: var(--rule); color: var(--muted); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.badge { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); min-width: 0; }
.badge .ico { width: 26px; height: 26px; color: var(--flame); }
.badge.off { background: transparent; }
.badge.off .ico { color: var(--muted); opacity: .6; }
.badge strong { display: block; font-size: 15px; line-height: 1.25; }
.badge span.d { display: block; font-size: 13px; color: var(--muted); line-height: 1.3; }
details.how { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; }
details.how summary { cursor: pointer; font-weight: 700; padding: 10px 0; }
details.how ul { margin: 0 0 12px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.foot { font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
.sync { display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync.cloud::before { background: var(--ok); }
.sync.error::before { background: var(--bad); }

/* ---------- lesson */
.lbar { display: grid; grid-template-columns: 44px 1fr 44px; gap: 10px; align-items: center; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.lbar-title { min-width: 0; }
.lbar-title strong { display: block; font-family: var(--f-display); font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dots { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
.dots i { width: 18px; height: 6px; border-radius: 99px; background: var(--line); }
.dots i.on { background: var(--blue); }
.dots i.now { background: var(--yellow); }
.dots i.story { width: 10px; }
.xp-pill { font-weight: 700; font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.intro { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.bridge { background: var(--blue-soft); border-radius: 12px; padding: 12px 14px; font-size: 16px; }
.bridge b { display: block; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); margin-bottom: 2px; }
.step { display: flex; flex-direction: column; gap: 12px; }
.chip-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--ink); color: var(--paper); letter-spacing: .02em; }
.chip.soft { background: var(--ok-soft); color: var(--ok); }
.step-text { font-size: 18px; }
.code-read {
  margin: 0; font-family: var(--f-mono); font-size: 15px; line-height: 1.65; background: var(--code-bg);
  border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; overflow-x: auto; white-space: pre;
}
.t-str { color: var(--syn-str); } .t-num { color: var(--syn-num); } .t-kw { color: var(--syn-kw); font-weight: 600; }
.t-fn { color: var(--syn-fn); } .t-com { color: var(--syn-com); font-style: italic; }
.editor { display: flex; border: 1.5px solid var(--line); border-radius: 14px; background: var(--code-bg); overflow: hidden; }
.editor:focus-within { border-color: var(--blue); }
.gutter {
  font-family: var(--f-mono); font-size: 16px; line-height: 26px; padding: 10px 8px 10px 10px; color: var(--muted);
  text-align: right; user-select: none; -webkit-user-select: none; white-space: pre; border-right: 1px solid var(--line);
  min-width: 2.4em; background: var(--card); opacity: .9; font-variant-numeric: tabular-nums;
}
textarea.code {
  flex: 1 1 auto; min-width: 0; display: block; margin: 0; border: 0; outline: none; resize: none;
  font-family: var(--f-mono); font-size: 16px; line-height: 26px; padding: 10px 12px; color: var(--ink);
  background-color: transparent;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 25px, var(--rule) 25px, var(--rule) 26px);
  background-position: 0 10px; background-attachment: local;
  white-space: pre; overflow-x: auto; overflow-y: hidden; tab-size: 4; caret-color: var(--blue);
}
.keys { display: flex; gap: 6px; overflow-x: auto; padding: 2px 1px 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.keys::-webkit-scrollbar { display: none; }
.key {
  flex: none; min-width: 46px; height: 42px; padding: 0 10px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); font-family: var(--f-mono); font-size: 17px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; touch-action: manipulation;
}
.key.run { background: var(--blue); color: var(--blue-ink); border-color: var(--blue); font-family: var(--f-body); font-weight: 700; font-size: 15px; }
.key:active { transform: scale(.96); }
.panel { border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.out { background: var(--card); border: 1px solid var(--line); }
.out pre { margin: 0; font-family: var(--f-mono); font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.out .empty { color: var(--muted); font-style: italic; font-size: 15px; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.err { background: var(--bad-soft); }
.err .label { color: var(--bad); }
.err-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.err-head strong { font-family: var(--f-mono); color: var(--bad); font-size: 16px; }
.err-msg { font-family: var(--f-mono); font-size: 14.5px; word-break: break-word; }
.err-line { margin: 0; font-family: var(--f-mono); font-size: 14px; background: var(--card); border-radius: 8px; padding: 6px 10px; overflow-x: auto; white-space: pre; }
.tip { font-size: 16px; }
.tip b { color: var(--ink); }
.good { background: var(--ok-soft); }
.good .label { color: var(--ok); }
.good-head { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ok); font-size: 18px; }
.good-head .ico { width: 24px; height: 24px; }
.xp-gain { margin-left: auto; font-size: 14px; background: var(--yellow); color: var(--yellow-ink); border-radius: 999px; padding: 2px 9px; }
.nope { background: var(--note-soft); }
.compare { display: grid; grid-template-columns: 1fr; gap: 8px; }
.compare div { min-width: 0; }
.compare pre { margin: 4px 0 0; font-family: var(--f-mono); font-size: 14.5px; background: var(--card); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; }
@media (min-width: 480px) { .compare { grid-template-columns: 1fr 1fr; } }
.note { font-size: 15px; background: var(--note-soft); border-radius: 10px; padding: 8px 12px; }
.hints { display: flex; flex-direction: column; gap: 8px; }
.hint { display: flex; gap: 10px; align-items: flex-start; background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; font-size: 16px; }
.hint .ico { color: var(--flame); margin-top: 2px; }
.options { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 10px 14px; text-align: left;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer; font-size: 17px;
}
.opt-key { width: 30px; height: 30px; flex: none; border-radius: 9px; display: grid; place-items: center; background: var(--rule); font-weight: 700; font-size: 15px; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .opt-key { background: var(--ok); color: var(--card); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .opt-key { background: var(--bad); color: var(--card); }
.opt-text { font-family: var(--f-mono); font-size: 16px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.ai { background: var(--card); border: 1px solid var(--line); }
.ai-out { font-size: 16px; white-space: pre-wrap; word-break: break-word; }
.ai-out pre { margin: 6px 0; font-family: var(--f-mono); font-size: 14px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; }
.ai-small { font-size: 13px; color: var(--muted); }
.actionbar {
  position: sticky; bottom: 0; z-index: 5; display: flex; gap: 10px;
  margin: 4px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) -28px;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to bottom, transparent, var(--paper) 22%);
}
.actionbar .btn { flex: 1 1 0; min-width: 0; }
.actionbar .btn-ghost { flex: 0 1 auto; }

/* ---------- finish screen */
.finish { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 24px; }
.finish-mark { width: 96px; height: 96px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; }
.finish-mark svg { width: 56px; height: 56px; }
.finish-mark path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .6s .15s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.finish-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.finish-stats div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 6px; }
.finish-stats strong { display: block; font-family: var(--f-display); font-size: 26px; font-variant-numeric: tabular-nums; }
.finish-stats span { font-size: 13px; color: var(--muted); }
.finish .btn { width: 100%; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 15px;
  box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .finish-mark path { stroke-dashoffset: 0; }
}

/* ---------- story */
.emblem { display: inline-flex; width: 56px; height: 56px; color: var(--ink); flex: none; }
.emblem svg { width: 100%; height: 100%; }
.story { display: flex; flex-direction: column; gap: 18px; }
.cover {
  background: var(--blue); color: var(--blue-ink); border-radius: 20px; padding: 20px 18px 22px;
  display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden;
}
.cover::after {
  content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%;
  border: 18px solid var(--yellow); opacity: .18; pointer-events: none;
}
.cover .emblem { color: var(--blue-ink); width: 64px; height: 64px; margin-bottom: 6px; }
.cover .eyebrow { color: inherit; opacity: .85; }
.cover h1 { font-size: 32px; }
.cover-skill { font-size: 15px; opacity: .9; }
.scene { font-family: var(--f-story); font-size: 20px; line-height: 1.6; display: flex; flex-direction: column; gap: 14px; max-width: 34em; }
.mentor { margin: 0; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }
.mentor blockquote { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 4px 16px 16px 16px; padding: 12px 14px; box-shadow: var(--shadow); }
.mentor blockquote p { font-family: var(--f-story); font-style: italic; font-size: 19px; line-height: 1.5; }
.mentor figcaption { margin-top: 6px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--yellow); color: var(--yellow-ink); font-family: var(--f-display); font-weight: 800; font-size: 18px;
  box-shadow: 0 0 0 3px var(--card);
}

    while (indents.length > 1) { indents.pop(); add('DEDENT', 0); }
    add('EOF', null);
    return toks;
  }

  // ------------------------------------------------------------------ parser
  class Parser {
    constructor(toks) { this.toks = toks; this.p = 0; this.loop = 0; this.func = 0; }
    get tok() { return this.toks[this.p]; }
    peek(o) { return this.toks[Math.min(this.p + (o || 1), this.toks.length - 1)]; }
    next() { return this.toks[this.p++]; }
    isOp(v, t) { t = t || this.tok; return t.type === 'OP' && t.value === v; }
    isKw(v, t) { t = t || this.tok; return t.type === 'NAME' && t.value === v; }
    eatOp(v) { if (this.isOp(v)) { this.p++; return true; } return false; }
    eatKw(v) { if (this.isKw(v)) { this.p++; return true; } return false; }
    fail(msg, t) { t = t || this.tok; throw new PyError('SyntaxError', msg || 'invalid syntax', t.line); }
    expectOp(v, msg) { if (!this.eatOp(v)) this.fail(msg); }
    name() { const t = this.tok; if (t.type !== 'NAME' || KEYWORDS.has(t.value)) this.fail(); this.p++; return t.value; }
    startsExpr(t) {
      t = t || this.tok;
      if (t.type === 'NUMBER' || t.type === 'STRING') return true;
      if (t.type === 'NAME') return !KEYWORDS.has(t.value) || ['True', 'False', 'None', 'not', 'lambda'].includes(t.value);
      return t.type === 'OP' && ['(', '[', '{', '-', '+', '~'].includes(t.value);
    }
    atEnd() { return this.tok.type === 'NEWLINE' || this.tok.type === 'EOF' || this.isOp(';'); }

    program() {
      const body = [];
      while (this.tok.type !== 'EOF') {
        if (this.tok.type === 'NEWLINE') { this.p++; continue; }
        body.push(...this.statement());
      }
      return body;
    }
    statement() {
      const t = this.tok;
      if (t.type === 'INDENT') throw new PyError('IndentationError', 'unexpected indent', t.line);
      if (t.type === 'DEDENT') { this.p++; return []; }
      if (t.type === 'NAME') {
        switch (t.value) {
          case 'if': return [this.ifStmt('if')];
          case 'while': return [this.whileStmt()];
          case 'for': return [this.forStmt()];
          case 'def': return [this.defStmt()];
          case 'try': return [this.tryStmt()];
          case 'class': case 'with': case 'async':
            throw new PyError('AppLimit', `'${t.value}' blocks aren't part of these lessons yet, so this practice app can't run them.`, t.line);
          case 'elif': case 'else': case 'except': case 'finally':
            this.fail();
        }
      }
      return this.simpleStatements();
    }
    suite(kind, headerLine) {
      if (!this.isOp(':')) {
        if (this.isOp('=')) this.fail("invalid syntax. Maybe you meant '==' or ':=' instead of '='?");
        this.fail("expected ':'");
      }
      this.p++;
      if (this.tok.type === 'NEWLINE') {
        this.p++;
        if (this.tok.type !== 'INDENT') throw new PyError('IndentationError', `expected an indented block after ${kind} on line ${headerLine}`, this.tok.line);
        this.p++;
        const body = [];
        while (this.tok.type !== 'DEDENT' && this.tok.type !== 'EOF') {
          if (this.tok.type === 'NEWLINE') { this.p++; continue; }
          body.push(...this.statement());
        }
        if (this.tok.type === 'DEDENT') this.p++;
        return body;
      }
      return this.simpleStatements();
    }
    ifStmt(word) {
      const line = this.next().line;
      const test = this.namedTest();
      const body = this.suite(`'${word}' statement`, line);
      let orelse = [];
      if (this.isKw('elif')) orelse = [this.ifStmt('elif')];
      else if (this.isKw('else')) { const l = this.next().line; orelse = this.suite("'else' statement", l); }
      return { type: 'If', test, body, orelse, line };
    }
    namedTest() {
      const e = this.test();
      if (this.isOp(':=')) throw new PyError('AppLimit', "The := operator isn't part of these lessons yet.", this.tok.line);
      return e;
    }
    whileStmt() {
      const line = this.next().line;
      const test = this.namedTest();
      this.loop++; const body = this.suite("'while' statement", line); this.loop--;
      let orelse = null;
      if (this.isKw('else')) { const l = this.next().line; orelse = this.suite("'else' statement", l); }
      return { type: 'While', test, body, orelse, line };
    }
    forStmt() {
      const line = this.next().line;
      const target = this.targetList();
      if (!this.eatKw('in')) this.fail();
      const iter = this.testList();
      this.loop++; const body = this.suite("'for' statement", line); this.loop--;
      let orelse = null;
      if (this.isKw('else')) { const l = this.next().line; orelse = this.suite("'else' statement", l); }
      return { type: 'For', target, iter, body, orelse, line };
    }
    targetList() {
      const line = this.tok.line;
      const first = this.bitOr();
      let t = first;
      if (this.isOp(',')) {
        const items = [first];
        while (this.eatOp(',')) { if (this.isKw('in') || this.isOp('=')) break; items.push(this.bitOr()); }
        t = { type: 'Tuple', items, line };
      }
      this.checkTarget(t, false);
      return t;
    }
    params(closer) {
      const params = [];
      let sawDefault = false;
      while (!this.isOp(closer)) {
        if (this.isOp('*') || this.isOp('**') || this.isOp('/')) throw new PyError('AppLimit', "*args, **kwargs and / in function definitions aren't part of these lessons yet.", this.tok.line);
        const t = this.tok;
        const name = this.name();
        if (params.some((p) => p.name === name)) this.fail(`duplicate argument '${name}' in function definition`, t);
        if (closer === ')' && this.eatOp(':')) this.test();
        let def = null;
        if (this.eatOp('=')) { def = this.test(); sawDefault = true; }
        else if (sawDefault) this.fail('parameter without a default follows parameter with a default', t);
        params.push({ name, default: def });
        if (!this.eatOp(',')) break;
      }
      return params;
    }
    defStmt() {
      const line = this.next().line;
      const name = this.name();
      this.expectOp('(', "expected '('");
      const params = this.params(')');
      this.expectOp(')');
      if (this.eatOp('->')) this.test();
      const savedLoop = this.loop; this.loop = 0; this.func++;
      const body = this.suite('function definition', line);
      this.loop = savedLoop; this.func--;
      const { locals, globalsDecl } = analyze(body, params.map((p) => p.name));
      return { type: 'FunctionDef', name, params, body, locals, globalsDecl, line };
    }
    tryStmt() {
      const line = this.next().line;
      const body = this.suite("'try' statement", line);
      const handlers = [];
      while (this.isKw('except')) {
        const l = this.next().line;
        let type = null, name = null;
        if (!this.isOp(':')) { type = this.test(); if (this.eatKw('as')) name = this.name(); }
        handlers.push({ type, name, body: this.suite("'except' statement", l), line: l });
      }
      let orelse = null, finalbody = null;
      if (this.isKw('else')) { const l = this.next().line; orelse = this.suite("'else' statement", l); }
      if (this.isKw('finally')) { const l = this.next().line; finalbody = this.suite("'finally' statement", l); }
      if (!handlers.length && !finalbody) this.fail("expected 'except' or 'finally' block");
      return { type: 'Try', body, handlers, orelse, finalbody, line };
    }
    simpleStatements() {
      const out = [this.small()];
      while (this.eatOp(';')) { if (this.tok.type === 'NEWLINE' || this.tok.type === 'EOF') break; out.push(this.small()); }
      if (this.tok.type === 'NEWLINE') this.p++;
      else if (this.tok.type !== 'EOF') {
        const last = out[out.length - 1];
        const t = this.tok;
        if (last.type === 'Expr' && last.value.type === 'Name' && last.value.id === 'print' && (t.type === 'STRING' || t.type === 'NAME' || t.type === 'NUMBER')) {
          this.fail("Missing parentheses in call to 'print'. Did you mean print(...)?", t);
        }
        this.fail();
      }
      return out;
    }
    small() {
      const t = this.tok, line = t.line;
      if (t.type === 'NAME') {
        switch (t.value) {
          case 'pass': this.p++; return { type: 'Pass', line };
          case 'break': this.p++; if (!this.loop) this.fail("'break' outside loop", t); return { type: 'Break', line };
          case 'continue': this.p++; if (!this.loop) this.fail("'continue' not properly in loop", t); return { type: 'Continue', line };
          case 'return': this.p++; if (!this.func) this.fail("'return' outside function", t); return { type: 'Return', value: this.atEnd() ? null : this.testList(), line };
          case 'global': { this.p++; const names = [this.name()]; while (this.eatOp(',')) names.push(this.name()); return { type: 'Global', names, line }; }
          case 'nonlocal': case 'yield': case 'await':
            throw new PyError('AppLimit', `'${t.value}' isn't part of these lessons yet.`, line);
          case 'del': { this.p++; const target = this.testList(); const targets = target.type === 'Tuple' ? target.items : [target]; targets.forEach((x) => this.checkTarget(x, false, 'delete')); return { type: 'Del', targets, line }; }
          case 'import': {
            this.p++; const names = [];
            do { const nm = this.dotted(); let as = null; if (this.eatKw('as')) as = this.name(); names.push({ name: nm, as }); } while (this.eatOp(','));
            return { type: 'Import', names, line };
          }
          case 'from': {
            this.p++; const mod = this.dotted();
            if (!this.eatKw('import')) this.fail();
            const names = [];
            if (this.isOp('*')) throw new PyError('AppLimit', "'from ... import *' isn't supported in this practice app.", line);
            const paren = this.eatOp('(');
            do { if (paren && this.isOp(')')) break; const nm = this.name(); let as = null; if (this.eatKw('as')) as = this.name(); names.push({ name: nm, as }); } while (this.eatOp(','));
            if (paren) this.expectOp(')');
            return { type: 'ImportFrom', module: mod, names, line };
          }
          case 'raise': { this.p++; return { type: 'Raise', exc: this.atEnd() ? null : this.test(), line }; }
          case 'assert': { this.p++; const test = this.test(); const msg = this.eatOp(',') ? this.test() : null; return { type: 'Assert', test, msg, line }; }
        }
      }
      const first = this.testList();
      if (this.isOp('=')) {
        const targets = [first];
        while (this.eatOp('=')) targets.push(this.testList());
        const value = targets.pop();
        targets.forEach((x) => this.checkTarget(x, false));
        return { type: 'Assign', targets, value, line };
      }
      const t2 = this.tok;
      if (t2.type === 'OP' && /^(\+|-|\*|\/|\/\/|%|\*\*|&|\||\^|<<|>>)=$/.test(t2.value)) {
        this.checkTarget(first, true);
        this.p++;
        return { type: 'AugAssign', target: first, op: t2.value.slice(0, -1), value: this.testList(), line };
      }
      if (this.isOp(':') && first.type === 'Name') {
        this.p++; this.test();
        if (this.eatOp('=')) return { type: 'Assign', targets: [first], value: this.testList(), line };
        return { type: 'Pass', line };
      }
      return { type: 'Expr', value: first, line };
    }
    dotted() { let nm = this.name(); while (this.eatOp('.')) nm += '.' + this.name(); return nm; }
    checkTarget(node, aug, verb) {
      const v = verb || 'assign to';
      const say = (what, hint) => this.fail(aug ? `'${what}' is an illegal expression for augmented assignment` : `cannot ${v} ${what}${hint && v === 'assign to' ? " here. Maybe you meant '==' instead of '='?" : ''}`, node);
      switch (node.type) {
        case 'Name': case 'Subscript': case 'Attribute': return;
        case 'Tuple': case 'List':
          if (aug) this.fail(`'${node.type === 'Tuple' ? 'tuple' : 'list'}' is an illegal expression for augmented assignment`, node);
          node.items.forEach((x) => this.checkTarget(x, false, verb)); return;
        case 'Const':
          if (node.value === true || node.value === false || node.value === null) this.fail(`cannot ${v} ${pyRepr(node.value)}`, node);
          return say('literal', true);
        case 'Call': return say('function call', true);
        case 'FStr': return say('f-string expression', true);
        case 'Compare': return say('comparison', false);
        case 'Lambda': return say('lambda', false);
        case 'IfExp': return say('conditional expression', false);
        case 'Dict': return say('dict literal', true);
        case 'ListComp': return say('list comprehension', false);
        default: return say('expression', true);
      }
    }
    testList() {
      const line = this.tok.line;
      const first = this.test();
      if (!this.isOp(',')) return first;
      const items = [first];
      while (this.eatOp(',')) { if (!this.startsExpr()) break; items.push(this.test()); }
      return { type: 'Tuple', items, line };
    }
    test() {
      if (this.isKw('lambda')) return this.lambda();
      const line = this.tok.line;
      const body = this.orTest();
      if (this.isKw('if')) {
        this.p++;
        const cond = this.orTest();
        if (!this.eatKw('else')) this.fail("expected 'else' after 'if' expression");
        return { type: 'IfExp', test: cond, body, orelse: this.test(), line };
      }
      return body;
    }
    lambda() {
      const line = this.next().line;
      const params = this.params(':');
      this.expectOp(':');
      const savedF = this.func; this.func = 1;
      const body = this.test();
      this.func = savedF;
      const locals = new Set(params.map((p) => p.name));
      return { type: 'Lambda', params, body, locals, line };
    }
    orTest() {
      const line = this.tok.line;
      const first = this.andTest();
      if (!this.isKw('or')) return first;
      const values = [first];
      while (this.eatKw('or')) values.push(this.andTest());
      return { type: 'BoolOp', op: 'or', values, line };
    }
    andTest() {
      const line = this.tok.line;
      const first = this.notTest();
      if (!this.isKw('and')) return first;
      const values = [first];
      while (this.eatKw('and')) values.push(this.notTest());
      return { type: 'BoolOp', op: 'and', values, line };
    }
    notTest() {
      if (this.isKw('not')) { const line = this.next().line; return { type: 'Not', operand: this.notTest(), line }; }
      return this.comparison();
    }
    comparison() {
      const line = this.tok.line;
      const left = this.bitOr();
      const ops = [], comps = [];
      for (;;) {
        const t = this.tok;
        let op = null;
        if (t.type === 'OP' && ['<', '>', '==', '>=', '<=', '!='].includes(t.value)) { op = t.value; this.p++; }
        else if (this.isKw('in')) { op = 'in'; this.p++; }
        else if (this.isKw('not') && this.isKw('in', this.peek())) { op = 'not in'; this.p += 2; }
        else if (this.isKw('is')) { this.p++; op = this.eatKw('not') ? 'is not' : 'is'; }
        else break;
        ops.push(op); comps.push(this.bitOr());
      }
      return ops.length ? { type: 'Compare', left, ops, comps, line } : left;
    }
    binLevel(next, ops) {
      let left = next();
      while (this.tok.type === 'OP' && ops.includes(this.tok.value)) {
        const t = this.next();
        left = { type: 'BinOp', op: t.value, left, right: next(), line: t.line };
      }
      return left;
    }
    bitOr() { return this.binLevel(() => this.bitXor(), ['|']); }
    bitXor() { return this.binLevel(() => this.bitAnd(), ['^']); }
    bitAnd() { return this.binLevel(() => this.shift(), ['&']); }
    shift() { return this.binLevel(() => this.arith(), ['<<', '>>']); }
    arith() { return this.binLevel(() => this.term(), ['+', '-']); }
    term() { return this.binLevel(() => this.factor(), ['*', '/', '//', '%', '@']); }
    factor() {
      if (this.isOp('-') || this.isOp('+') || this.isOp('~')) {
        const t = this.next();
        return { type: 'Unary', op: t.value, operand: this.factor(), line: t.line };
      }
      return this.power();
    }
    power() {
      const base = this.atomExpr();
      if (this.isOp('**')) { const t = this.next(); return { type: 'BinOp', op: '**', left: base, right: this.factor(), line: t.line }; }
      return base;
    }
    atomExpr() {
      let node = this.atom();
      for (;;) {
        const t = this.tok;
        if (this.isOp('(')) { this.p++; node = this.call(node, t.line); }
        else if (this.isOp('[')) {
          this.p++;
          node = { type: 'Subscript', value: node, index: this.subscript(), line: t.line };
          if (!this.eatOp(']')) { if (this.startsExpr()) this.fail('invalid syntax. Perhaps you forgot a comma?'); this.fail(); }
        } else if (this.isOp('.')) {
          this.p++;
          const nt = this.tok;
          if (nt.type !== 'NAME') this.fail('invalid syntax', nt);
          this.p++;
          node = { type: 'Attribute', value: node, attr: nt.value, line: t.line };
        } else break;
      }
      return node;
    }
    call(func, line) {
      const args = [], kwargs = [];
      if (this.eatOp(')')) return { type: 'Call', func, args, kwargs, line };
      for (;;) {
        if (this.isOp('*') || this.isOp('**')) throw new PyError('AppLimit', "Unpacking with * or ** in a call isn't part of these lessons yet.", this.tok.line);
        const t = this.tok;
        if (t.type === 'NAME' && !KEYWORDS.has(t.value) && this.isOp('=', this.peek())) {
          this.p += 2;
          if (kwargs.some((k) => k.name === t.value)) this.fail(`keyword argument repeated: ${t.value}`, t);
          kwargs.push({ name: t.value, value: this.test() });
        } else {
          let a = this.test();
          if (this.isKw('for')) {
            a = this.comprehension('ListComp', a, t.line);
            if (args.length || kwargs.length || !this.isOp(')')) this.fail('Generator expression must be parenthesized', t);
          }
          if (kwargs.length) this.fail('positional argument follows keyword argument', t);
          args.push(a);
        }
        if (this.eatOp(')')) break;
        if (this.eatOp(',')) { if (this.eatOp(')')) break; continue; }
        if (this.isOp('=')) this.fail('expression cannot contain assignment, perhaps you meant "=="?');
        if (this.startsExpr()) this.fail('invalid syntax. Perhaps you forgot a comma?');
        this.fail();
      }
      return { type: 'Call', func, args, kwargs, line };
    }
    subscript() {
      const line = this.tok.line;
      let lower = null, upper = null, step = null;
      if (!this.isOp(':')) {
        lower = this.test();
        if (!this.isOp(':')) {
          if (this.isOp(',')) { const items = [lower]; while (this.eatOp(',')) { if (this.isOp(']')) break; items.push(this.test()); } return { type: 'Tuple', items, line }; }
          return lower;
        }
      }
      this.expectOp(':');
      if (!this.isOp(']') && !this.isOp(':')) upper = this.test();
      if (this.eatOp(':') && !this.isOp(']')) step = this.test();
      return { type: 'Slice', lower, upper, step, line };
    }
    comprehension(kind, elt, line, valueNode) {
      const gens = [];
      while (this.isKw('for')) {
        this.p++;
        const target = this.targetList();
        if (!this.eatKw('in')) this.fail();
        const iter = this.orTest();
        const ifs = [];
        while (this.isKw('if')) { this.p++; ifs.push(this.orTest()); }
        gens.push({ target, iter, ifs });
      }
      return { type: kind, elt, value: valueNode, gens, line };
    }
    atom() {
      const t = this.tok, line = t.line;
      if (t.type === 'NUMBER') { this.p++; return { type: 'Const', value: t.value, line }; }
      if (t.type === 'STRING') return this.strings();
      if (t.type === 'NAME') {
        if (t.value === 'True') { this.p++; return { type: 'Const', value: true, line }; }
        if (t.value === 'False') { this.p++; return { type: 'Const', value: false, line }; }
        if (t.value === 'None') { this.p++; return { type: 'Const', value: null, line }; }
        if (KEYWORDS.has(t.value)) this.fail();
        this.p++;
        return { type: 'Name', id: t.value, line };
      }
      if (t.type === 'OP') {
        if (t.value === '(') {
          this.p++;
          if (this.eatOp(')')) return { type: 'Tuple', items: [], line };
          const first = this.test();
          if (this.isKw('for')) { const g = this.comprehension('ListComp', first, line); this.expectOp(')'); return g; }
          if (this.eatOp(')')) return first;
          if (this.isOp(',')) {
            const items = [first];
            while (this.eatOp(',')) { if (this.isOp(')')) break; items.push(this.test()); }
            if (!this.eatOp(')')) { if (this.startsExpr()) this.fail('invalid syntax. Perhaps you forgot a comma?'); this.fail(); }
            return { type: 'Tuple', items, line };
          }
          if (this.isOp('=')) this.fail("invalid syntax. Maybe you meant '==' or ':=' instead of '='?");
          if (this.startsExpr()) this.fail('invalid syntax. Perhaps you forgot a comma?');
          this.fail();
        }
        if (t.value === '[') {
          this.p++;
          if (this.eatOp(']')) return { type: 'List', items: [], line };
          const first = this.test();
          if (this.isKw('for')) { const c = this.comprehension('ListComp', first, line); this.expectOp(']'); return c; }
          const items = [first];
          while (this.eatOp(',')) { if (this.isOp(']')) break; items.push(this.test()); }
          if (!this.eatOp(']')) { if (this.startsExpr()) this.fail('invalid syntax. Perhaps you forgot a comma?'); this.fail(); }
          return { type: 'List', items, line };
        }
        if (t.value === '{') {
          this.p++;
          if (this.eatOp('}')) return { type: 'Dict', keys: [], values: [], line };
          if (this.isOp('**')) throw new PyError('AppLimit', "Unpacking with ** isn't part of these lessons yet.", line);
          const k = this.test();
          if (this.eatOp(':')) {
            const v = this.test();
            if (this.isKw('for')) { const c = this.comprehension('DictComp', k, line, v); this.expectOp('}'); return c; }
            const keys = [k], values = [v];
            while (this.eatOp(',')) {
              if (this.isOp('}')) break;
              keys.push(this.test());
              this.expectOp(':', "':' expected after dictionary key");
              values.push(this.test());
            }
            if (!this.eatOp('}')) { if (this.startsExpr()) this.fail('invalid syntax. Perhaps you forgot a comma?'); this.fail(); }
            return { type: 'Dict', keys, values, line };
          }
          if (this.startsExpr()) this.fail('invalid syntax. Perhaps you forgot a comma?');
          throw new PyError('AppLimit', "Sets like {1, 2, 3} aren't part of these lessons yet.", line);
        }
        if (t.value === '...') { this.p++; return { type: 'Const', value: null, line }; }
      }
      this.fail();
    }
    strings() {
      const line = this.tok.line;
      const parts = [];
      let isF = false;
      while (this.tok.type === 'STRING') {
        const t = this.next();
        if (t.f) { isF = true; parts.push(...fparts(t.value, t.raw, t.line)); }
        else parts.push({ s: t.raw ? t.value : decodeEscapes(t.value) });
      }
      if (!isF) return { type: 'Const', value: parts.map((x) => x.s).join(''), line };
      return { type: 'FStr', parts, line };

      while (fr.kind === 'comp') { if (fr.vars.has(name)) return fr.vars.get(name); fr = fr.parent; }
      if (fr.kind === 'func') {
        if (fr.fn.locals.has(name)) {
          if (fr.vars.has(name)) return fr.vars.get(name);
          throw new PyError('UnboundLocalError', `cannot access local variable '${name}' where it is not associated with a value`);
        }
        for (let c = fr.fn.closure; c; c = c.kind === 'comp' ? c.parent : c.fn ? c.fn.closure : null) {
          if (c.vars.has(name)) return c.vars.get(name);
        }
      }
      if (this.globals.has(name)) return this.globals.get(name);
      if (BUILTINS.has(name)) return BUILTINS.get(name);
      throw this.nameError(name, fr);
    }
    nameError(name, fr) {
      const cands = [];
      if (fr.kind === 'func') cands.push(...fr.vars.keys());
      const globalsList = [...MODULE_GLOBALS, ...this.globals.keys()];
      if (fr.kind !== 'func') cands.push(...globalsList);
      cands.push(...globalsList, ...BUILTIN_NAMES);
      const base = `name '${name}' is not defined`;
      let msg = base;
      const s = suggest(name, cands);
      if (s) msg += `. Did you mean: '${s}'?`;
      if (STDLIB.has(name)) msg += s ? ` Or did you forget to import '${name}'?` : `. Did you forget to import '${name}'?`;
      const e = new PyError('NameError', msg); e.argMsg = base; return e;
    }
    assignName(name, v, f) {
      if (f.kind === 'comp') { f.vars.set(name, v); return; }
      if (f.kind === 'global' || f.fn.globalsDecl.has(name)) { this.globals.set(name, v); return; }
      f.vars.set(name, v);
    }
    sliceArgs(n, f) {
      const g = (x) => { if (!x) return null; const v = this.eval(x, f); if (v === null) return null; if (!isInt(v)) throw TE('slice indices must be integers or None or have an __index__ method'); return num(v); };
      return [g(n.lower), g(n.upper), g(n.step)];
    }
    eval(n, f) {
      switch (n.type) {
        case 'Const': return n.value;
        case 'Name': return this.lookup(n.id, f);
        case 'FStr': return this.fstr(n, f);
        case 'List': return n.items.map((x) => this.eval(x, f));
        case 'Tuple': return new PyTuple(n.items.map((x) => this.eval(x, f)));
        case 'Dict': { const d = new PyDict(); n.keys.forEach((k, i) => { const kv = this.eval(k, f); d.set(kv, this.eval(n.values[i], f)); }); return d; }
        case 'BinOp': {
          const a = this.eval(n.left, f), b = this.eval(n.right, f);
          if (n.op === '@') throw TE(`unsupported operand type(s) for @: '${typeName(a)}' and '${typeName(b)}'`);
          return binop(n.op, a, b);
        }
        case 'Unary': return unary(n.op, this.eval(n.operand, f));
        case 'Not': return !truthy(this.eval(n.operand, f));
        case 'BoolOp': {
          let v = null;
          for (const x of n.values) { v = this.eval(x, f); if (n.op === 'or' ? truthy(v) : !truthy(v)) return v; }
          return v;
        }
        case 'Compare': {
          let left = this.eval(n.left, f);
          for (let i = 0; i < n.ops.length; i++) {
            const right = this.eval(n.comps[i], f);
            if (!compare(n.ops[i], left, right)) return false;
            left = right;
          }
          return true;
        }
        case 'IfExp': return truthy(this.eval(n.test, f)) ? this.eval(n.body, f) : this.eval(n.orelse, f);
        case 'Call': {
          const fn = this.eval(n.func, f);
          const args = n.args.map((a) => this.eval(a, f));
          const kw = Object.create(null);
          for (const k of n.kwargs) kw[k.name] = this.eval(k.value, f);
          return this.callValue(fn, args, kw);
        }
        case 'Attribute': return getAttr(this.eval(n.value, f), n.attr);
        case 'Subscript': {
          const o = this.eval(n.value, f);
          if (n.index.type === 'Slice') { const [lo, hi, st] = this.sliceArgs(n.index, f); return getSlice(o, lo, hi, st); }
          return getItem(o, this.eval(n.index, f));
        }
        case 'ListComp': case 'DictComp': return this.comp(n, f);
        case 'Lambda': {
          const defaults = n.params.map((p) => (p.default ? this.eval(p.default, f) : undefined));
          return new PyFunction('<lambda>', n.params.map((p) => p.name), defaults, [{ type: 'Return', value: n.body, line: n.line }], n.locals, new Set(), f.kind === 'global' ? null : f);
        }
        case 'Slice': throw TE('slices are only allowed inside [ ]');
      }
      throw new PyError('AppLimit', `This kind of expression (${n.type}) isn't supported yet.`);
    }
    comp(n, f) {
      const frame = { kind: 'comp', vars: new Map(), parent: f };
      const isDict = n.type === 'DictComp';
      const out = isDict ? new PyDict() : [];
      const loop = (gi) => {
        if (gi === n.gens.length) {
          if (isDict) out.set(this.eval(n.elt, frame), this.eval(n.value, frame));
          else out.push(this.eval(n.elt, frame));
          return;
        }
        const g = n.gens[gi];
        const it = this.eval(g.iter, gi === 0 ? f : frame);
        for (const item of iterate(it)) {
          this.tick();
          this.assign(g.target, item, frame);
          if (g.ifs.every((c) => truthy(this.eval(c, frame)))) loop(gi + 1);
        }
      };
      loop(0);
      return out;
    }
    fstr(n, f) {
      let s = '';
      for (const p of n.parts) {
        if (p.s !== undefined) { s += p.s; continue; }
        let v = this.eval(p.expr, f);
        if (p.debug) s += p.debug;
        const conv = p.conv || (p.debug && !p.spec ? 'r' : null);
        if (conv === 'r' || conv === 'a') v = pyRepr(v); else if (conv === 's') v = pyStr(v);
        const spec = p.spec ? p.spec.map((x) => (x.s !== undefined ? x.s : formatSpec(this.eval(x.expr, f), ''))).join('') : '';
        s += formatSpec(v, spec);
      }
      return s;
    }
    callValue(fn, args, kw) {
      if (fn instanceof PyBuiltin) { if (!fn.fn) throw TE(`cannot create '${fn.name}' instances`); return fn.fn(args, kw, this); }
      if (fn instanceof PyBound) return fn.fn(fn.self, args, kw, this);
      if (fn instanceof PyFunction) return this.callFunction(fn, args, kw);
      if (fn instanceof PyExcType) { if (Object.keys(kw).length) throw TE(`${fn.name}() takes no keyword arguments`); return new PyExc(fn, args); }
      throw TE(`'${typeName(fn)}' object is not callable`);
    }
    callFunction(fn, args, kw) {
      if (this.depth >= 200) throw new PyError('RecursionError', 'maximum recursion depth exceeded');
      const frame = { kind: 'func', fn, vars: new Map() };
      const P = fn.params, nP = P.length;
      const nReq = fn.defaults.filter((d) => d === undefined).length;
      if (args.length > nP) {
        const takes = nReq === nP ? `${nP} positional argument${nP === 1 ? '' : 's'}` : `from ${nReq} to ${nP} positional arguments`;
        throw TE(`${fn.name}() takes ${takes} but ${args.length} ${args.length === 1 ? 'was' : 'were'} given`);
      }
      args.forEach((a, i) => frame.vars.set(P[i], a));
      for (const k of Object.keys(kw)) {
        if (!P.includes(k)) throw TE(`${fn.name}() got an unexpected keyword argument '${k}'`);
        if (frame.vars.has(k)) throw TE(`${fn.name}() got multiple values for argument '${k}'`);
        frame.vars.set(k, kw[k]);
      }
      const missing = [];
      P.forEach((p, i) => { if (!frame.vars.has(p)) { if (fn.defaults[i] !== undefined) frame.vars.set(p, fn.defaults[i]); else missing.push(p); } });
      if (missing.length) {
        const q = missing.map((m) => `'${m}'`);
        const list = q.length === 1 ? q[0] : q.length === 2 ? `${q[0]} and ${q[1]}` : `${q.slice(0, -1).join(', ')}, and ${q[q.length - 1]}`;
        throw TE(`${fn.name}() missing ${missing.length} required positional argument${missing.length === 1 ? '' : 's'}: ${list}`);
      }
      const saved = this.line;
      this.depth++;
      try { this.execBlock(fn.body, frame); }
      catch (e) { if (e instanceof ReturnSignal) { this.line = saved; return e.value; } throw e; }
      finally { this.depth--; }
      this.line = saved;
      return null;
    }
    snapshotVars() {
      const out = {};
      for (const [k, v] of this.globals) {
        if (v instanceof PyFunction || v instanceof PyBuiltin || v instanceof PyModule || v instanceof PyExcType || v instanceof PyBound) continue;
        let r; try { r = pyRepr(v); } catch (e) { r = '?'; }
        out[k] = { type: typeName(v), repr: r.length > 300 ? r.slice(0, 300) + '…' : r };
      }
      return out;
    }
  }

  function normalize(src) {
    const notes = [];
    let s = String(src).replace(/\r\n?/g, '\n');
    if (/[“”„‘’‚′″]/.test(s)) {
      s = s.replace(/[“”„″]/g, '"').replace(/[‘’‚′]/g, "'");
      notes.push('quotes');
    }
    s = s.replace(/ /g, ' ').replace(/\t/g, '    ');
    return { s, notes };
  }

  function run(code, opts) {
    opts = opts || {};
    const { s, notes } = normalize(code);
    const ip = new Interp(opts);
    let error = null;
    try {
      ip.execBlock(parse(s), ip.globalFrame);
    } catch (e) {
      if (e instanceof PyError) error = { type: e.pyType, message: e.pyMsg, line: e.line || ip.line };
      else if (e instanceof RangeError) error = { type: 'RecursionError', message: 'maximum recursion depth exceeded', line: ip.line };
      else error = { type: 'InternalError', message: String((e && e.message) || e), line: ip.line };
    }
    if (error) error.lineText = error.line ? (s.split('\n')[error.line - 1] || '') : '';
    let vars = {};
    try { vars = ip.snapshotVars(); } catch (e) { vars = {}; }
    return { output: ip.out.join(''), error, notes, vars, steps: ip.steps };
  }

  root.MiniPy = { run, version: '1.0.0' };

        },

          type: 'quiz', title: 'What comes next?',
          say: 'Zara leans on the whiteboard. “One question before we celebrate.”',

          explain: 'Rules that must always be right belong in code. Next week you’ll teach Python to decide with if and else, like a Condition in Power Automate.',

      ],
    },
  ];

  const normOut = (s) => String(s || '').replace(/[ \t]+$/gm, '').replace(/\n+$/, '');

  // Checks a code step. Returns {ok, reason, message?, expected?, got?}.
  function check(step, code, res) {
    const c = step.check || { kind: 'ran' };
    if (!res) return { ok: false, reason: 'not-run' };
    if (c.kind === 'error') {
      if (res.error && res.error.type === c.errorType) return { ok: true };
      return { ok: false, reason: 'want-error', message: `Run the code as it is to see the ${c.errorType}.` };
    }
    if (res.error) return { ok: false, reason: 'error' };
    if (step.type === 'blank' && code.includes('___')) return { ok: false, reason: 'blank', message: 'Replace the ___ with your answer.' };
    const out = normOut(res.output);
    if (c.mustUse) {
      for (const alts of c.mustUse) {
        if (!alts.some((a) => code.includes(a))) return { ok: false, reason: 'must-use', message: c.mustUseMsg || `This step wants you to use ${alts[0]} in your code.` };
      }
    }
    if (c.vars) {
      for (const [name, want] of Object.entries(c.vars)) {
        const v = res.vars && res.vars[name];
        if (!v) return { ok: false, reason: 'var-missing', message: `Create a variable called ${name}.` };
        if (v.repr !== want) return { ok: false, reason: 'var-wrong', message: `Check ${name}: it should be ${want}, but it is ${v.repr}.` };
      }
    }
    switch (c.kind) {
      case 'ran':
        return { ok: true };
      case 'changed':
        if (!out) return { ok: false, reason: 'empty', message: 'Your code ran but showed nothing. Keep the print() line.' };
        if (out === normOut(c.from)) return { ok: false, reason: 'same', message: 'The output is the same as before. Change something, then run it again.' };
        return { ok: true };
      case 'exact': {
        const want = normOut(c.out);
        if (out === want) return { ok: true };
        let message = 'Not quite. Compare your output with the expected output.';
        if (out.toLowerCase() === want.toLowerCase()) message = 'So close. Only the capital letters are different.';
        else if (out.replace(/\s+/g, '') === want.replace(/\s+/g, '')) message = 'So close. Only the spaces or line breaks are different.';
        else if (!out) message = 'Your code ran but showed nothing. Did you print() the result?';
        return { ok: false, reason: 'output', message, expected: want, got: out };
      }
    }
    return { ok: true };
  }

  root.LESSONS = LESSONS;
  root.PSCheck = check;
})(typeof window !== 'undefined' ? window : globalThis);

    moon: '<svg viewBox="0 0 64 64"><path d="M40 8a22 22 0 1 0 16 34A18 18 0 0 1 40 8z" fill="var(--yellow)"/><path d="M26 22l-6 12h8l-4 12 12-16h-8l4-8z" fill="currentColor"/></svg>',

  };
  function icon(name) { const s = document.createElement('span'); s.className = 'ico'; s.setAttribute('aria-hidden', 'true'); s.innerHTML = ICONS[name]; return s; }

  const avatar = () => h('span', { class: 'avatar', 'aria-hidden': 'true' }, 'Z');

  // Inline formatting for lesson text: **bold**, `code`, line breaks.
  function fmt(text) {
    const frag = document.createDocumentFragment();
    String(text || '').split('\n').forEach((line, i) => {
      if (i) frag.append(document.createElement('br'));
      const re = /(\*\*[^*]+\*\*|`[^`]+`)/g;
      let last = 0, m;
      while ((m = re.exec(line))) {
        if (m.index > last) frag.append(line.slice(last, m.index));
        const tok = m[0];
        frag.append(tok.startsWith('**') ? h('strong', null, tok.slice(2, -2)) : h('code', { class: 'ic' }, tok.slice(1, -1)));
        last = m.index + tok.length;
      }
      if (last < line.length) frag.append(line.slice(last));
    });
    return frag;
  }
  function fmtAnswer(text) {
    const frag = document.createDocumentFragment();
    const parts = String(text).split(/```(?:python|py)?\n?([\s\S]*?)(?:```|$)/);
    parts.forEach((p, i) => {
      if (i % 2) frag.append(h('pre', null, p.replace(/\n$/, '')));
      else if (p.trim()) frag.append(h('span', null, fmt(p.replace(/^\n+|\n+$/g, ''))));

  }

  // Small read-only syntax highlighter.
  const KW = new Set('False None True and as assert break class continue def del elif else except finally for from global if import in is lambda not or pass raise return try while with yield'.split(' '));
  const BI = new Set('print len str int float round range list dict sum min max abs sorted type bool enumerate zip input'.split(' '));
  function highlight(code) {
    const frag = document.createDocumentFragment();
    const re = /(#[^\n]*)|([rRfFbBuU]{0,2}"(?:[^"\\\n]|\\.)*"?|[rRfFbBuU]{0,2}'(?:[^'\\\n]|\\.)*'?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|([\s\S])/g;

    while ((m = re.exec(code))) {
      if (m[1]) frag.append(h('span', { class: 't-com' }, m[1]));
      else if (m[2]) frag.append(h('span', { class: 't-str' }, m[2]));
      else if (m[3]) frag.append(h('span', { class: 't-num' }, m[3]));
      else if (m[4]) frag.append(KW.has(m[4]) ? h('span', { class: 't-kw' }, m[4]) : BI.has(m[4]) ? h('span', { class: 't-fn' }, m[4]) : m[4]);

  let toastTimer = null;

  const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  // ------------------------------------------------------------ progress
  const pad = (n) => String(n).padStart(2, '0');
  const dayStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => dayStr(new Date());
  const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dayStr(d); };
  const fresh = () => ({ v: 1, xp: 0, stepMax: {}, done: {}, streak: { count: 0, last: '' }, badges: {}, updatedAt: 0 });
  function clean(p) {
    const f = fresh();
    if (!p || typeof p !== 'object') return f;
    return {
      v: 1,
      xp: Number(p.xp) || 0,
      stepMax: p.stepMax && typeof p.stepMax === 'object' ? { ...p.stepMax } : {},
      done: p.done && typeof p.done === 'object' ? { ...p.done } : {},
      streak: p.streak && typeof p.streak === 'object' ? { count: Number(p.streak.count) || 0, last: String(p.streak.last || '') } : f.streak,
      badges: p.badges && typeof p.badges === 'object' ? { ...p.badges } : {},
      updatedAt: Number(p.updatedAt) || 0,
    };
  }
  function loadLocal() { try { return clean(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) { return fresh(); } }
  let P = loadLocal();

  function merge(a, b) {
    a = clean(a); b = clean(b);
    const out = fresh();
    out.xp = Math.max(a.xp, b.xp);
    for (const k of new Set([...Object.keys(a.stepMax), ...Object.keys(b.stepMax)])) out.stepMax[k] = Math.max(a.stepMax[k] || 0, b.stepMax[k] || 0);
    for (const k of new Set([...Object.keys(a.done), ...Object.keys(b.done)])) out.done[k] = [a.done[k], b.done[k]].filter(Boolean).sort()[0];
    for (const k of new Set([...Object.keys(a.badges), ...Object.keys(b.badges)])) out.badges[k] = [a.badges[k], b.badges[k]].filter(Boolean).sort()[0];

  function setSync(s) {

  const draftKey = (li, si) => `python-steps-draft:${LESSONS[li].id}:${si}`;

  // ------------------------------------------------------------ friendly error help

  function friendly(err) {
    const m = err.message || '';
    switch (err.type) {
      case 'SyntaxError':
        if (/unterminated (triple-quoted )?string/.test(m)) return 'A piece of text is missing its closing quote. Text needs a quote at the start and at the end, "like this". A prompt in triple quotes needs """ at both ends.';
        if (/was never closed/.test(m)) return 'A bracket was opened but never closed. Every ( needs a ), every [ needs a ] and every { needs a }.';
        if (/unmatched|does not match/.test(m)) return 'There is a closing bracket without a matching opening one. Count your brackets.';
        if (/forgot a comma/.test(m)) return 'Two values sit side by side with nothing between them. Add a comma, or a + to join them.';
        if (/Missing parentheses in call to 'print'/.test(m)) return 'print needs brackets: print("like this").';
        if (/expected ':'/.test(m)) return 'Lines that start with if, for, while or def must end with a colon (:).';
        if (/'=='/.test(m)) return 'One = stores a value. Two == compare values.';
        if (/invalid character/.test(m)) return 'There is a character Python can\'t read, often a curly quote or a long dash copied from a document. Delete it and type it again.';
        if (/invalid decimal literal/.test(m)) return 'A number runs straight into letters. Variable names can\'t start with a number.';
        if (/leading zeros/.test(m)) return 'Whole numbers can\'t start with 0 in Python. Write 7, not 07.';
        if (/cannot assign to/.test(m)) return 'The variable name goes on the left of = and the value on the right, like stock = 120.';
        if (/f-string/.test(m)) return 'Something inside the { } of an f-string is incomplete. Each { needs a } and a name or value inside.';
        return `Python couldn't read line ${err.line}. Look for a typo, a missing symbol or an extra one. Names can't contain spaces: use an underscore, like max_tokens. To multiply, use *.`;
      case 'IndentationError':
        if (/unexpected indent/.test(m)) return 'This line starts with spaces it shouldn\'t have. In Python, spaces at the start of a line mean "this belongs inside the block above".';
        if (/expected an indented block/.test(m)) return 'After a line that ends with a colon, the next line must start with 4 spaces. Use the Tab key above.';
        return 'The spaces at the start of this line don\'t line up with the lines around it.';
      case 'NameError': return 'Python doesn\'t know this name yet. Check the spelling and capital letters (prompt and Prompt are different names), check you created it on an earlier line, and put text in quotes.';
      case 'TypeError':
        if (/can only concatenate str/.test(m)) return 'You are joining text and a number with +. Turn the number into text with str(), or use an f-string.';
        if (/unsupported operand/.test(m)) return 'These two kinds of value can\'t be combined with this symbol. Check both are numbers, or both are text.';
        if (/not callable/.test(m)) return 'There are brackets ( ) after something that isn\'t a command. Maybe a variable has the same name as a command.';
        if (/argument/.test(m)) return 'The command got the wrong number of values inside its brackets.';
        return 'A value is the wrong kind for what you asked Python to do.';
      case 'AttributeError': return 'This kind of value has no method with that name. Check the spelling and capital letters. Method names are lowercase.';
      case 'ZeroDivisionError': return 'You divided by zero, which has no answer. Check the number after the /.';
      case 'ValueError': return /int\(\)|float/.test(m) ? 'That text can\'t be turned into a number. Look for letters, spaces or a decimal point.' : 'The value is the right kind, but Python can\'t use it here.';
      case 'IndexError': return 'You asked for a position that doesn\'t exist. Positions start at 0, so the last item in a list of 3 is at position 2.';
      case 'KeyError': return 'That key isn\'t in the dictionary. Check the spelling, or use .get().';
      case 'UnboundLocalError': return 'Inside a function, a variable was used before it was given a value.';
      case 'RecursionError': return 'A function kept calling itself and never stopped.';
      case 'ProgramTooLong': case 'OutputLimit': return 'Look for a loop whose condition never becomes False.';
      case 'AppLimit': return 'This works in full Python, but this practice app only covers what the lessons use.';
    }
    return 'Read the error type and the line number, then look closely at that line.';
  }

  async function sendChat(text) {

    const turns = [{ role: 'user', content: chatInstructions() }, ...history.map((m) => ({ role: m.role, content: m.text }))];

  function insertAtCursor(ta, key) {
